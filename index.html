<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Notebook</title>
<style>
:root {
  --bg: #f7f6f2; --card: #ffffff; --text: #1f2328; --muted: #6a6f76; --line: #e3e1da;
  --accent: #2f5bd3; --accent-text: #ffffff; --ok: #1f7a4a; --ng: #c2412d; --soft: #eef2fc;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --card: #1e2125; --text: #e8eaed; --muted: #9aa0a6; --line: #30343a;
    --accent: #7aa2ff; --accent-text: #0d1117; --ok: #5cc98a; --ng: #ff8a75; --soft: #232a3a;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --card: #1e2125; --text: #e8eaed; --muted: #9aa0a6; --line: #30343a;
  --accent: #7aa2ff; --accent-text: #0d1117; --ok: #5cc98a; --ng: #ff8a75; --soft: #232a3a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 -apple-system, "Hiragino Sans", sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 16px 16px 96px; }
h1 { font-size: 20px; margin: 4px 0 12px; }
h2 { font-size: 17px; margin: 20px 0 8px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 12px 0; }
.muted { color: var(--muted); font-size: 14px; }
.btn { display: block; width: 100%; padding: 14px; margin: 8px 0; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-text); font-size: 16px; font-weight: 600; text-align: center; text-decoration: none; }
.btn.secondary { background: var(--soft); color: var(--text); }
.btn:disabled { opacity: .45; }
.row { display: flex; gap: 8px; } .row > * { flex: 1; }
.choice { display: block; width: 100%; text-align: left; padding: 13px 14px; margin: 8px 0; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); font-size: 16px; }
.choice.sel { border-color: var(--accent); background: var(--soft); }
.choice.ok { border-color: var(--ok); color: var(--ok); font-weight: 600; }
.choice.ng { border-color: var(--ng); color: var(--ng); }
.big { font-size: 28px; font-weight: 700; margin: 4px 0; }
.q { font-size: 18px; margin: 8px 0 4px; }
.speak { border: 1px solid var(--line); background: var(--soft); color: var(--text); border-radius: 999px; padding: 6px 14px; font-size: 15px; }
.speak.large { font-size: 22px; padding: 18px 28px; display: block; margin: 16px auto; }
.ex { margin: 10px 0; padding-left: 10px; border-left: 3px solid var(--line); }
.tw { border-bottom: 1px dotted var(--muted); cursor: pointer; }
.tw.added { background: var(--soft); border-bottom-color: var(--accent); }
.ok-t { color: var(--ok); font-weight: 700; } .ng-t { color: var(--ng); font-weight: 700; }
.pre { white-space: pre-wrap; }
nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
nav button { flex: 1; padding: 12px 0; border: 0; background: none; color: var(--muted); font-size: 14px; }
nav button.on { color: var(--accent); font-weight: 700; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; } .bar > i { display: block; height: 100%; background: var(--accent); }
textarea { width: 100%; min-height: 120px; font-size: 12px; }
select { font-size: 16px; padding: 6px; }
</style>
</head>
<body>
<main id="app"><p class="muted">読み込み中…</p></main>
<nav id="nav"></nav>
<script src="app.js"></script>
</body>
</html>
